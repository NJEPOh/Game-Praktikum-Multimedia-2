<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Pulau Logika - Narasi Petualangan</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/menu.css">
</head>
<!--
    Daftar Aset Gambar pada narasi.html:
    - Gambar 2: background-2.png | Lokasi: assets/images/backgrounds/background-2.png | Ukuran disarankan: 1920x1080 px | Fungsi: Latar belakang halaman narasi (melalui css/menu.css)
    - Gambar 8: karakter_pemain.png | Lokasi: assets/images/characters/karakter_pemain.png | Ukuran tampilan: 120x160 px | Fungsi: Karakter penjelajah pemain
    - Gambar 9: karakter_pemandu.png | Lokasi: assets/images/characters/karakter_pemandu.png | Ukuran tampilan: 120x160 px | Fungsi: Karakter pemandu pulau (Tetua Arka)
-->
<body class="latar-pulau" data-bgm="music-background-2.mp3">
    <header class="bilah-atas">
        <div class="info-header">
            <span class="lencana-wilayah">Kisah Pengantar</span>
            <span class="info-pemain-header">Pulau Logika</span>
        </div>
        <div class="aksi-header">
            <button type="button" id="tombol-suara" class="tombol tombol-netral tombol-kecil" data-sfx-hover data-sfx-click>
                Suara: Aktif
            </button>
        </div>
    </header>

    <main class="wadah-utama">
        <section class="panel-game" aria-labelledby="judul-narasi">
            <h1 id="judul-narasi" class="judul-halaman">Awal Petualangan di Pulau Logika</h1>
            <p class="subjudul-halaman">Simak percakapan pengantar misi sebelum menjelajahi peta pulau.</p>

            <div class="panggung-narasi">
                <div id="kartu-narasi-pemain" class="kartu-karakter-narasi">
                    <!-- Gambar 8: karakter_pemain.png | Ukuran tampilan: 120x160 px | Aset: assets/images/characters/karakter_pemain.png -->
                    <img
                        src="assets/images/characters/karakter_pemain.png"
                        alt="Karakter pemain penjelajah"
                        width="120"
                        height="160"
                    >
                    <span id="label-nama-pemain-narasi" class="nama-karakter-narasi">Penjelajah</span>
                </div>

                <div class="kotak-dialog-narasi" aria-live="polite">
                    <div>
                        <span id="label-bagian-narasi" class="label-bagian-narasi">Bagian 1 dari 3</span>
                        <h2 id="nama-pembicara" class="nama-pembicara-dialog">Tetua Arka (Pemandu Pulau)</h2>
                        <p id="teks-dialog" class="teks-dialog-narasi"></p>
                    </div>
                    <div class="indikator-titik-narasi" aria-hidden="true">
                        <span id="titik-narasi-0" class="titik-narasi aktif"></span>
                        <span id="titik-narasi-1" class="titik-narasi"></span>
                        <span id="titik-narasi-2" class="titik-narasi"></span>
                    </div>
                </div>

                <div id="kartu-narasi-pemandu" class="kartu-karakter-narasi pembicara-aktif">
                    <!-- Gambar 9: karakter_pemandu.png | Ukuran tampilan: 120x160 px | Aset: assets/images/characters/karakter_pemandu.png -->
                    <img
                        src="assets/images/characters/karakter_pemandu.png"
                        alt="Karakter pemandu pulau Tetua Arka"
                        width="120"
                        height="160"
                    >
                    <span class="nama-karakter-narasi">Tetua Arka</span>
                </div>
            </div>

            <div class="baris-tombol">
                <button
                    type="button"
                    id="tombol-narasi-back"
                    class="tombol tombol-netral"
                    data-sfx-hover
                    data-sfx-click
                >
                    Back
                </button>
                <button
                    type="button"
                    id="tombol-narasi-next"
                    class="tombol tombol-utama"
                    data-sfx-hover
                    data-sfx-click
                >
                    Next
                </button>
            </div>
        </section>
    </main>

    <script src="js/penyimpanan.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/navigasi.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
