<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Pulau Logika - Halaman Awal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/menu.css">
</head>
<!--
    Daftar Aset Gambar pada index.html:
    - Gambar 1: background-1.png | Lokasi: assets/images/backgrounds/background-1.png | Ukuran disarankan: 1920x1080 px | Fungsi: Latar belakang halaman awal (melalui css/menu.css)
    - Gambar 11: logo_game.png | Lokasi: assets/images/icons/logo_game.png | Ukuran tampilan: 320x120 px | Fungsi: Logo judul permainan Misi Pulau Logika
    - Gambar 8: karakter_pemain.png | Lokasi: assets/images/characters/karakter_pemain.png | Ukuran tampilan: 140x180 px | Fungsi: Ilustrasi karakter penjelajah utama
-->
<body class="latar-awal" data-bgm="music-background-1.mp3">
    <header class="bilah-atas">
        <div class="info-header">
            <span class="lencana-wilayah">Misi Pulau Logika</span>
            <span class="info-pemain-header">Game Edukasi Computational Thinking</span>
        </div>
        <div class="aksi-header">
            <button type="button" id="tombol-suara" class="tombol tombol-netral tombol-kecil" data-sfx-hover data-sfx-click>
                Suara: Aktif
            </button>
        </div>
    </header>

    <main class="wadah-utama">
        <section class="panel-game panel-awal" aria-labelledby="judul-utama">
            <div class="bungkus-logo-awal">
                <!-- Gambar 11: logo_game.png | Ukuran tampilan: 320x120 px | Aset: assets/images/icons/logo_game.png -->
                <img
                    src="assets/images/icons/logo_game.png"
                    alt="Logo Misi Pulau Logika"
                    width="320"
                    height="120"
                >
            </div>

            <h1 id="judul-utama" class="judul-halaman">Misi Pulau Logika</h1>
            <p class="subjudul-halaman">
                Jelajahi empat wilayah pulau dan kuasai empat pilar Berpikir Komputasional:
                Dekomposisi, Pengenalan Pola, Abstraksi, dan Algoritma!
            </p>

            <div class="bungkus-karakter-awal">
                <!-- Gambar 8: karakter_pemain.png | Ukuran tampilan: 140x180 px | Aset: assets/images/characters/karakter_pemain.png -->
                <img
                    src="assets/images/characters/karakter_pemain.png"
                    alt="Karakter pemain penjelajah"
                    width="140"
                    height="180"
                >
            </div>

            <div class="formulir-pemain">
                <label for="input-nama-pemain" class="label-input">Nama Penjelajah:</label>
                <input
                    type="text"
                    id="input-nama-pemain"
                    class="input-nama"
                    placeholder="Ketik namamu di sini..."
                    maxlength="30"
                    autocomplete="off"
                >
                <div id="pesan-validasi-awal" class="kotak-pesan tersembunyi" role="alert"></div>
            </div>

            <div class="baris-tombol">
                <button
                    type="button"
                    id="tombol-mulai"
                    class="tombol tombol-utama"
                    data-sfx-hover
                    data-sfx-click
                >
                    Mulai Permainan
                </button>
                <button
                    type="button"
                    id="tombol-petunjuk"
                    class="tombol tombol-sekunder"
                    data-sfx-hover
                    data-sfx-click
                >
                    Petunjuk
                </button>
            </div>
        </section>
    </main>

    <script src="js/penyimpanan.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/navigasi.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
