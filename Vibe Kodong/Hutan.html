Pemain harus drag and drop material ke komponen rumah

Komponen rumah pada awalnya akan berwarna hitam putih menandakan komponen belum selesai dibuat

Setelah komponen rumah selesai dibuat (Material yang dikumpulkan cukup 
=> asset komponen rumah menjadi berwarna)
Buat logikanya di JS
Buat juga animasi hover
Buat juga animasi hover dan animasi yang lebih menarik saat drag and drop material di komponen

Tambahan
Saat menyelesaikan stage ini jadikan stage_selesai = true
Agar di Peta bisa dibuka

-->
