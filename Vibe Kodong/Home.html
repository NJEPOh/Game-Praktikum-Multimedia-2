<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div style="width: 1440px; height: 1024px; position: relative; background: white; overflow: hidden">
        <img style="width: 1465px; height: 1042px; left: -13px; top: -9px; position: absolute"
            src="Assets/BG_Home.jpg" />
        <div
            style="left: 125px; top: 67.50px; position: absolute; flex-direction: column; justify-content: flex-start; align-items: center; gap: 120px; display: inline-flex">
            <div
                style="flex-direction: column; justify-content: flex-start; align-items: center; gap: 20px; display: flex">
                <div
                    style="padding-left: 80px; padding-right: 80px; padding-top: 40px; padding-bottom: 40px; background: rgba(0, 0, 0, 0.70); justify-content: center; align-items: center; gap: 10px; display: inline-flex">
                    <div
                        style="color: white; font-size: 96px; font-family: Pixelhands; font-weight: 500; word-wrap: break-word">
                        Misi Pulau Logika</div>
                </div>
                <div
                    style="padding-left: 40px; padding-right: 40px; padding-top: 20px; padding-bottom: 20px; background: rgba(0, 0, 0, 0.70); justify-content: center; align-items: center; gap: 10px; display: inline-flex">
                    <div
                        style="color: white; font-size: 48px; font-family: Pixelhands; font-weight: 500; word-wrap: break-word">
                        Latih kemampuan berpikirmu melalui berbagai misi!</div>
                </div>
            </div>

            <!-- Ini adalah isian nama -->
            <!-- Apabila diklik akan jadi field isian nama dan pemain bisa memasukkan nama -->
            <div
                style="padding-left: 80px; padding-right: 80px; padding-top: 40px; padding-bottom: 40px; background: rgba(0, 0, 0, 0.40); outline: 5px white solid; outline-offset: -5px; justify-content: center; align-items: center; gap: 10px; display: inline-flex">
                <div
                    style="color: white; font-size: 48px; font-family: Pixelhands; font-weight: 500; word-wrap: break-word">
                    Siapa namamu?</div>
            </div>
            <div
                style="width: 482px; flex-direction: column; justify-content: flex-start; align-items: center; gap: 20px; display: flex">

                <!-- Ini adalah button untuk mulai permainan -->
                <!-- Tambahkan animasi hover -->
                <!-- Apabila ditekan akan mulai permainan, menuju ke Narator 1.html untuk narasi dulu -->
                <div
                    style="align-self: stretch; padding-left: 80px; padding-right: 80px; padding-top: 20px; padding-bottom: 20px; background: black; outline: 10px white solid; outline-offset: -10px; justify-content: center; align-items: center; gap: 10px; display: inline-flex">
                    <div
                        style="color: white; font-size: 32px; font-family: Pixelhands; font-weight: 500; word-wrap: break-word">
                        MULAI PERMAINAN</div>
                </div>

                <!-- Ini adalah button untuk petunjuk -->
                <!-- Tambahkan animasi hover -->
                <!-- Apabila ditekan akan menuju ke Petunjuk.html -->
                <div
                    style="padding-left: 80px; padding-right: 80px; padding-top: 20px; padding-bottom: 20px; background: black; outline: 10px white solid; outline-offset: -10px; justify-content: center; align-items: center; gap: 10px; display: inline-flex">
                    <div
                        style="color: white; font-size: 32px; font-family: Pixelhands; font-weight: 500; word-wrap: break-word">
                        PETUNJUK</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
