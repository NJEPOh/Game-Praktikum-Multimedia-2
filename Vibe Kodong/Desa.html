<!-- Gameplay Membangun Jalan Desa -->

<!-- 

Pemain harus memilih opsi pola berikutnya untuk membangun desa
Akan ada 5 soal di stage ini
Setiap soal punya pola berbeda
Ada pola angka, huruf dan bentuk
Polanya bergantian, bertambah atau berulang
Setiap jenis pola ada 50 soal dan selalu di acak
Jadi setiap permainan tidak akan memunculkan soal yang sama
Buat database soal dan kunci jawaban menggunakan json

Gambar polanya menggunakan semantik <img>, letaknya ada dikomentar di bawah
Buat animasi hover menarik

-->
