<!-- Gameplay Gunung Mencari Jalan -->

<!-- 

Pemain harus mencari jalan di gunung dengan menemukan informasi yang penting
Ada banyak gambar di jalur dan pemain harus memilah mana yang penting dan mana yang tidak penting
Pemain harus drag and drop informasi ke kotak Informasi penting dan Informasi tidak penting di kanan

Informasi yang penting:
jalan

informasi tidak penting:
semak
gelondong kayu
bunga
kelinci
sapi
burung

Akan ada 4 kali pengulangan di stage ini, jadi posisi akan di acak
yang terpenting jalan tidak boleh berdekatan dengan jalan (pikirkan logikanya)
Apabila informasi sudah didrag ke kotak informasi, maka gambarnya akan pindah
Baru muncul lagi di perulangan setelahnya

-->
